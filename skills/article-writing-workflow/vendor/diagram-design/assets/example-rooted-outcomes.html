<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Durable advantage · Rooted outcomes</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:rgba(45,49,66,.12); --accent:#eb6c36; --sans:'Geist',system-ui,sans-serif; --serif:'Instrument Serif',serif; --mono:'Geist Mono',ui-monospace,monospace; }
      body { margin:0; min-height:100vh; padding:48px 32px; background:var(--paper); color:var(--ink); font-family:var(--sans); }
      main { width:min(100%,1280px); margin:auto; }
      .eyebrow { margin:0 0 8px; color:var(--muted); font:500 11px var(--mono); letter-spacing:.16em; text-transform:uppercase; }
      h1 { margin:0 0 24px; font:400 clamp(28px,4vw,40px)/1 var(--serif); letter-spacing:-.02em; }
      svg { display:block; width:100%; height:auto; }
      .tag { fill:var(--soft); font:500 10px var(--mono); letter-spacing:.14em; }
      .label { fill:var(--ink); font:600 16px var(--sans); }
      .small { fill:var(--muted); font:400 12px var(--sans); }
      .root-label { fill:var(--ink); font:600 13px var(--sans); }
      .root-note { fill:var(--soft); font:400 11px var(--sans); }
      .takeaway { fill:#f5f5f5; font:600 18px var(--sans); }
      .takeaway-note { fill:#bfc0c0; font:500 10px var(--mono); letter-spacing:.12em; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Rooted outcomes · causal-depth metaphor</p>
      <h1>Durable advantage grows from foundations you keep</h1>
      <svg viewBox="0 0 1280 720" role="img" aria-labelledby="rooted-outcomes-title rooted-outcomes-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="rooted-outcomes-title">Durable advantage grows from foundations you keep</title>
        <desc id="rooted-outcomes-desc">A rooted outcomes diagram showing a thriving owned system above the ground line and six compounding foundations below it, contrasted with a smaller rented orchard whose roots remain inaccessible.</desc>
        <rect width="1280" height="720" fill="#f5f5f5" />
        <text x="48" y="40" class="tag">VISIBLE TODAY</text>
        <text x="48" y="352" class="tag">FOUNDATIONS THAT COMPOUND</text>
        <line x1="48" y1="336" x2="1232" y2="336" stroke="#2d3142" stroke-width="2" />
        <text x="48" y="324" class="small">What people can notice and reward now</text>
        <text x="48" y="376" class="small">What makes the result repeatable</text>

        <path d="M160 188 C160 108 240 84 300 116 C348 56 464 72 488 144 C560 132 604 188 576 248 C592 312 520 328 456 300 C388 348 276 332 236 292 C184 300 144 256 160 188Z" fill="rgba(45,49,66,.07)" stroke="#2d3142" stroke-width="2" />
        <path d="M336 336 L336 272 C320 244 324 220 340 204 L368 204 C384 220 388 244 372 272 L372 336Z" fill="#4f5d75" />
        <circle cx="276" cy="160" r="16" fill="#7a8399" /><circle cx="404" cy="132" r="16" fill="#eb6c36" /><circle cx="484" cy="212" r="16" fill="#7a8399" />
        <text x="368" y="36" class="label" text-anchor="middle">Owned operating system</text>
        <text x="368" y="56" class="small" text-anchor="middle" style="fill:#2d3142">the system that produces the result</text>
        <text x="276" y="148" class="small" text-anchor="middle">pricing power</text>
        <text x="404" y="120" class="small" text-anchor="middle">repeat demand</text>
        <text x="484" y="200" class="small" text-anchor="middle">quality signal</text>

        <rect x="536" y="108" width="216" height="76" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="1" />
        <text x="552" y="136" class="label">High-value outcomes</text>
        <text x="552" y="160" class="small">scarce · trusted · priced well</text>
        <path d="M536 160 H500" fill="none" stroke="#7a8399" stroke-width="1" />
        <rect x="536" y="212" width="216" height="76" rx="8" fill="#ffffff" stroke="#bfc0c0" stroke-width="1" />
        <text x="552" y="240" class="label">Broadly available outcomes</text>
        <text x="552" y="264" class="small">easy to copy · easy to substitute</text>
        <path d="M536 252 H516" fill="none" stroke="#7a8399" stroke-width="1" />

        <path d="M352 336 C304 380 244 396 184 520" fill="none" stroke="#4f5d75" stroke-width="6" stroke-linecap="round" />
        <path d="M356 336 C340 404 336 440 328 536" fill="none" stroke="#4f5d75" stroke-width="6" stroke-linecap="round" />
        <path d="M364 336 C404 388 444 424 468 520" fill="none" stroke="#4f5d75" stroke-width="6" stroke-linecap="round" />
        <path d="M368 336 C448 372 544 412 612 476" fill="none" stroke="#4f5d75" stroke-width="6" stroke-linecap="round" />
        <path d="M344 336 C264 400 240 444 232 568" fill="none" stroke="#4f5d75" stroke-width="6" stroke-linecap="round" />
        <path d="M372 336 C428 420 464 480 500 568" fill="none" stroke="#4f5d75" stroke-width="6" stroke-linecap="round" />
        <text x="172" y="540" class="root-label" text-anchor="end">Network effects</text><text x="172" y="560" class="root-note" text-anchor="end">more use improves the system</text>
        <text x="328" y="556" class="root-label" text-anchor="middle">Switching costs</text><text x="328" y="576" class="root-note" text-anchor="middle">leaving has a real cost</text>
        <text x="480" y="540" class="root-label">Exclusive resources</text><text x="480" y="560" class="root-note">access others cannot rent</text>
        <text x="624" y="484" class="root-label">Process strength</text><text x="624" y="504" class="root-note">the work gets better by repetition</text>

        <line x1="800" y1="96" x2="800" y2="560" stroke="#7a8399" stroke-width="2" stroke-dasharray="8 8" />
        <text x="1032" y="136" class="tag" text-anchor="middle">ALTERNATIVE: SOMEONE ELSE'S ORCHARD</text>
        <path d="M876 260 C876 224 912 208 940 224 C972 192 1020 200 1036 236 C1076 224 1104 256 1092 292 H876Z" fill="rgba(45,49,66,.06)" stroke="#7a8399" stroke-width="2" />
        <path d="M944 336 V288 H972 V336Z" fill="#7a8399" />
        <path d="M1040 260 C1040 224 1076 208 1104 224 C1136 192 1184 200 1200 236 C1240 224 1268 256 1256 292 H1040Z" fill="rgba(45,49,66,.06)" stroke="#7a8399" stroke-width="2" />
        <path d="M1108 336 V288 H1136 V336Z" fill="#7a8399" />
        <rect x="876" y="392" width="352" height="72" rx="8" fill="rgba(45,49,66,.03)" stroke="#bfc0c0" stroke-width="1" />
        <text x="896" y="420" class="label">You can buy the fruit</text>
        <text x="896" y="444" class="small">but you do not own the roots that compound it</text>
        <text x="1032" y="536" class="root-label" text-anchor="middle">Access is not ownership</text>

        <rect x="48" y="616" width="1184" height="72" rx="8" fill="#2d3142" />
        <text x="72" y="652" class="takeaway">Results may get you noticed. Foundations determine whether they can keep arriving.</text>
        <text x="1208" y="668" class="takeaway-note" text-anchor="end">ROOTED OUTCOMES</text>
      </svg>
    </main>
  </body>
</html>
