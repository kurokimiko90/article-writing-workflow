    .eyebrow-tag { fill: var(--soft); font: 500 8px var(--mono); letter-spacing: 0.14em; }
    .arrow-label { fill: var(--soft); font: 500 8px var(--mono); letter-spacing: 0.06em; }
    .badge-num { fill: var(--soft); font: 500 8px var(--mono); text-anchor: middle; }
    .card-term { fill: var(--ink); font: 600 13px var(--sans); }
    .stage-name { fill: var(--ink); font: 600 13px var(--sans); }
    .block-name { fill: var(--ink); font: 600 13px var(--sans); }
    .stage-name.focal, .block-name.focal { fill: var(--accent); }
    .question { fill: var(--soft); font: 400 9.5px var(--sans); }
    .bullet { fill: var(--muted); font: 400 10px var(--sans); }
    .detail { fill: var(--muted); font: 400 10px var(--sans); text-anchor: middle; }
    .step-label { fill: var(--muted); font: 500 9.5px var(--sans); text-anchor: middle; }
