<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card payment ecosystem · Ecosystem · dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#2d3142;--paper-2:#393e53;--ink:#f5f5f5;--muted:#bfc0c0;--soft:#8e98ac;--accent:#f08a59;--accent-tint:rgba(240,138,89,.10);--link:#6a95d8;--rule:rgba(245,245,245,.12);--zone-fill:rgba(245,245,245,.03);--zone-stroke:rgba(245,245,245,.28);--side-fill:rgba(191,192,192,.08);--side-stroke:#8e98ac;--store-fill:rgba(245,245,245,.06);--node-fill:#393e53;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
    .frame{max-width:1200px;width:100%}
    .eyebrow{font:500 .66rem var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
    h1{font:400 clamp(1.5rem,2.4vw + .75rem,2rem)/1.15 var(--serif);letter-spacing:-.02em;margin-bottom:1.5rem}
    svg{width:100%;min-width:1100px;display:block}
    svg text{font-family:var(--sans)}.connector{fill:none;stroke:var(--muted);stroke-width:1.2}.connector.funds{stroke:var(--link);stroke-width:1.4}.connector.relation{stroke:var(--soft);stroke-width:1;stroke-dasharray:4 3}.label-mask{fill:var(--paper)}.edge-label{fill:var(--muted);font:8px var(--mono);letter-spacing:.06em}.edge-label.funds{fill:var(--link)}.edge-label.relation{fill:var(--soft)}.zone{fill:var(--zone-fill);stroke:var(--zone-stroke)}.zone-mask,.node-mask{fill:var(--paper)}.zone-label{fill:var(--soft);font:500 8px var(--mono);letter-spacing:.18em}.actor{fill:var(--side-fill);stroke:var(--side-stroke)}.block{fill:var(--node-fill);stroke:var(--ink)}.block.focal{fill:var(--accent-tint);stroke:var(--accent)}.account{fill:var(--store-fill);stroke:var(--muted)}.role-box{fill:transparent;stroke:var(--soft);stroke-opacity:.6}.role-box.focal{stroke:var(--accent);stroke-opacity:1}.role-text{fill:var(--soft);font:500 7px var(--mono);letter-spacing:.08em}.role-text.focal{fill:var(--accent)}.node-name{fill:var(--ink);font:600 12px var(--sans)}.node-sub{fill:var(--muted);font:9px var(--mono)}.legend-key{fill:var(--muted);font:500 8px var(--mono);letter-spacing:.14em}.legend-text{fill:var(--muted);font:8px var(--sans)}
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Ecosystem · Diagram Design</p>
    <h1>How a card payment moves between four institutions</h1>
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ecosystem-dark-title ecosystem-dark-desc">
      <title id="ecosystem-dark-title">How a card payment moves between four institutions</title>
      <desc id="ecosystem-dark-desc">Ecosystem map showing a card payment travelling from a merchant platform through an acquirer and the card scheme to the issuing and acquiring banks, with instruction flows, funds movements, and account relations marked separately.</desc>
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--muted)"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--link)"/></marker><marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--soft)"/></marker></defs>
      <rect width="1200" height="800" fill="var(--paper)"/>
      <!-- Institution boundaries paint first, so a label mask may sit on a zone edge. -->
      <rect class="zone" x="220" y="72" width="736" height="120" rx="8" stroke-width="1"/><rect class="zone" x="220" y="248" width="736" height="120" rx="8" stroke-width="1"/><rect class="zone" x="220" y="424" width="736" height="120" rx="8" stroke-width="1"/><rect class="zone" x="220" y="600" width="352" height="104" rx="8" stroke-width="1"/><rect class="zone" x="604" y="600" width="352" height="104" rx="8" stroke-width="1"/>
      <rect class="zone-mask" x="528" y="68" width="120" height="16" rx="2"/><text class="zone-label" x="588" y="79" text-anchor="middle">MERCHANT PLATFORM</text><rect class="zone-mask" x="538" y="244" width="100" height="16" rx="2"/><text class="zone-label" x="588" y="255" text-anchor="middle">ACQUIRER / PSP</text><rect class="zone-mask" x="522" y="420" width="132" height="16" rx="2"/><text class="zone-label" x="588" y="431" text-anchor="middle">CARD SCHEME NETWORK</text><rect class="zone-mask" x="352" y="596" width="88" height="16" rx="2"/><text class="zone-label" x="396" y="607" text-anchor="middle">ISSUING BANK</text><rect class="zone-mask" x="730" y="596" width="100" height="16" rx="2"/><text class="zone-label" x="780" y="607" text-anchor="middle">ACQUIRING BANK</text>
      <!-- Connectors before nodes: z-order keeps every stroke behind the boxes. -->
      <line class="connector" x1="180" y1="136" x2="248" y2="136" marker-end="url(#arrow)"/>
      <line class="connector" x1="348" y1="168" x2="348" y2="280" marker-end="url(#arrow)"/>
      <line class="connector" x1="348" y1="344" x2="348" y2="456" marker-end="url(#arrow)"/>
      <line class="connector" x1="348" y1="520" x2="348" y2="632" marker-end="url(#arrow)"/>
      <line class="connector" x1="588" y1="168" x2="588" y2="280" marker-end="url(#arrow)"/>
      <path class="connector" d="M588 344 V392 Q588 400 596 400 H760 Q768 400 768 408 V456" marker-end="url(#arrow)"/>
      <path class="connector funds" d="M476 632 V584 Q476 576 484 576 H760 Q768 576 768 568 V520" marker-end="url(#arrow-link)"/>
      <line class="connector funds" x1="868" y1="520" x2="868" y2="632" marker-end="url(#arrow-link)"/>
      <path class="connector funds" d="M928 656 H984 Q992 656 992 648 V160 Q992 152 984 152 H928" marker-end="url(#arrow-link)"/>
      <line class="connector funds" x1="928" y1="136" x2="1020" y2="136" marker-end="url(#arrow-link)"/>
      <line class="connector relation" x1="828" y1="280" x2="828" y2="168" marker-end="url(#arrow-soft)"/>
      <path class="connector relation" d="M248 656 H120 Q112 656 112 648 V168" marker-end="url(#arrow-soft)"/>
      <!-- Edge labels keep an 8px gap from their stroke and stay in the open corridors. -->
      <rect class="label-mask" x="192" y="116" width="44" height="12" rx="2"/><text class="edge-label" x="214" y="125" text-anchor="middle">PAY</text><rect class="label-mask" x="356" y="218" width="68" height="12" rx="2"/><text class="edge-label" x="390" y="227" text-anchor="middle">AUTH REQ</text><rect class="label-mask" x="356" y="394" width="44" height="12" rx="2"/><text class="edge-label" x="378" y="403" text-anchor="middle">AUTH</text><rect class="label-mask" x="356" y="570" width="60" height="12" rx="2"/><text class="edge-label" x="386" y="579" text-anchor="middle">APPROVE</text><rect class="label-mask" x="596" y="218" width="52" height="12" rx="2"/><text class="edge-label" x="622" y="227" text-anchor="middle">ORDER</text><rect class="label-mask" x="644" y="380" width="68" height="12" rx="2"/><text class="edge-label" x="678" y="389" text-anchor="middle">CLEARING</text><rect class="label-mask" x="590" y="556" width="56" height="12" rx="2"/><text class="edge-label funds" x="618" y="565" text-anchor="middle">SETTLE</text><rect class="label-mask" x="876" y="570" width="56" height="12" rx="2"/><text class="edge-label funds" x="904" y="579" text-anchor="middle">PAYOUT</text><rect class="label-mask" x="1000" y="396" width="60" height="12" rx="2"/><text class="edge-label funds" x="1030" y="405" text-anchor="middle">SETTLED</text><rect class="label-mask" x="940" y="116" width="68" height="12" rx="2"/><text class="edge-label funds" x="974" y="125" text-anchor="middle">WITHDRAW</text><rect class="label-mask" x="836" y="218" width="60" height="12" rx="2"/><text class="edge-label relation" x="866" y="227" text-anchor="middle">BALANCE</text><rect class="label-mask" x="120" y="396" width="44" height="12" rx="2"/><text class="edge-label relation" x="142" y="405" text-anchor="middle">OWNS</text>
      <!-- Capability blocks, then the leaf account rows. -->
      <rect class="node-mask" x="40" y="104" width="140" height="64" rx="6"/><rect class="actor" x="40" y="104" width="140" height="64" rx="6" stroke-width="1"/><text class="node-name" x="110" y="134" text-anchor="middle">Cardholder</text><text class="node-sub" x="110" y="152" text-anchor="middle">card on file</text>
      <rect class="node-mask" x="1020" y="104" width="140" height="64" rx="6"/><rect class="actor" x="1020" y="104" width="140" height="64" rx="6" stroke-width="1"/><text class="node-name" x="1090" y="134" text-anchor="middle">Merchant</text><text class="node-sub" x="1090" y="152" text-anchor="middle">sells on platform</text>
      <rect class="node-mask" x="248" y="104" width="200" height="64" rx="6"/><rect class="block" x="248" y="104" width="200" height="64" rx="6" stroke-width="1"/><rect class="role-box" x="256" y="112" width="24" height="12" rx="2" stroke-width="0.8"/><text class="role-text" x="268" y="121" text-anchor="middle">UI</text><text class="node-name" x="348" y="142" text-anchor="middle">Checkout</text><text class="node-sub" x="348" y="158" text-anchor="middle">hosted card form</text>
      <rect class="node-mask" x="488" y="104" width="200" height="64" rx="6"/><rect class="block" x="488" y="104" width="200" height="64" rx="6" stroke-width="1"/><rect class="role-box" x="496" y="112" width="32" height="12" rx="2" stroke-width="0.8"/><text class="role-text" x="512" y="121" text-anchor="middle">ORD</text><text class="node-name" x="588" y="142" text-anchor="middle">Order core</text><text class="node-sub" x="588" y="158" text-anchor="middle">order state · refunds</text>
      <rect class="node-mask" x="728" y="104" width="200" height="64" rx="6"/><rect class="block" x="728" y="104" width="200" height="64" rx="6" stroke-width="1"/><rect class="role-box" x="736" y="112" width="32" height="12" rx="2" stroke-width="0.8"/><text class="role-text" x="752" y="121" text-anchor="middle">BAL</text><text class="node-name" x="828" y="142" text-anchor="middle">Merchant wallet</text><text class="node-sub" x="828" y="158" text-anchor="middle">platform balance</text>
      <rect class="node-mask" x="248" y="280" width="200" height="64" rx="6"/><rect class="block focal" x="248" y="280" width="200" height="64" rx="6" stroke-width="1"/><rect class="role-box focal" x="256" y="288" width="32" height="12" rx="2" stroke-width="0.8"/><text class="role-text focal" x="272" y="297" text-anchor="middle">PAY</text><text class="node-name" x="348" y="318" text-anchor="middle">Payment core</text><text class="node-sub" x="348" y="334" text-anchor="middle">auth · capture · retry</text>
      <rect class="node-mask" x="488" y="280" width="200" height="64" rx="6"/><rect class="block" x="488" y="280" width="200" height="64" rx="6" stroke-width="1"/><rect class="role-box" x="496" y="288" width="32" height="12" rx="2" stroke-width="0.8"/><text class="role-text" x="512" y="297" text-anchor="middle">CLR</text><text class="node-name" x="588" y="318" text-anchor="middle">Clearing core</text><text class="node-sub" x="588" y="334" text-anchor="middle">batch cutoff · files</text>
      <rect class="node-mask" x="728" y="280" width="200" height="64" rx="6"/><rect class="block" x="728" y="280" width="200" height="64" rx="6" stroke-width="1"/><rect class="role-box" x="736" y="288" width="40" height="12" rx="2" stroke-width="0.8"/><text class="role-text" x="756" y="297" text-anchor="middle">LEDG</text><text class="node-name" x="828" y="318" text-anchor="middle">Ledger core</text><text class="node-sub" x="828" y="334" text-anchor="middle">double-entry postings</text>
      <rect class="node-mask" x="248" y="456" width="320" height="64" rx="6"/><rect class="block" x="248" y="456" width="320" height="64" rx="6" stroke-width="1"/><rect class="role-box" x="256" y="464" width="40" height="12" rx="2" stroke-width="0.8"/><text class="role-text" x="276" y="473" text-anchor="middle">AUTH</text><text class="node-name" x="408" y="494" text-anchor="middle">Authorization switch</text><text class="node-sub" x="408" y="510" text-anchor="middle">real-time routing</text>
      <rect class="node-mask" x="608" y="456" width="320" height="64" rx="6"/><rect class="block focal" x="608" y="456" width="320" height="64" rx="6" stroke-width="1"/><rect class="role-box focal" x="616" y="464" width="32" height="12" rx="2" stroke-width="0.8"/><text class="role-text focal" x="632" y="473" text-anchor="middle">NET</text><text class="node-name" x="768" y="494" text-anchor="middle">Net settlement</text><text class="node-sub" x="768" y="510" text-anchor="middle">netted positions</text>
      <rect class="node-mask" x="248" y="632" width="296" height="48" rx="6"/><rect class="account" x="248" y="632" width="296" height="48" rx="6" stroke-width="1"/><text class="node-name" x="396" y="654" text-anchor="middle">Cardholder account</text><text class="node-sub" x="396" y="670" text-anchor="middle">debited at capture</text>
      <rect class="node-mask" x="632" y="632" width="296" height="48" rx="6"/><rect class="account" x="632" y="632" width="296" height="48" rx="6" stroke-width="1"/><text class="node-name" x="780" y="654" text-anchor="middle">Merchant account</text><text class="node-sub" x="780" y="670" text-anchor="middle">credited at T+2</text>
      <!-- Legend: horizontal strip below the diagram. -->
      <line x1="40" y1="744" x2="1160" y2="744" stroke="var(--rule)" stroke-width="0.8"/><text class="legend-key" x="40" y="764">FLOW KEY</text><line x1="128" y1="760" x2="160" y2="760" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/><text class="legend-text" x="172" y="764">Instruction</text><line x1="296" y1="760" x2="328" y2="760" stroke="var(--link)" stroke-width="1.4" marker-end="url(#arrow-link)"/><text class="legend-text" x="340" y="764">Funds movement</text><line x1="500" y1="760" x2="532" y2="760" stroke="var(--soft)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-soft)"/><text class="legend-text" x="544" y="764">Account relation</text><rect x="712" y="756" width="16" height="12" rx="2" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/><text class="legend-text" x="736" y="764">Focal core</text><rect x="856" y="756" width="16" height="12" rx="2" fill="var(--zone-fill)" stroke="var(--zone-stroke)" stroke-width="1"/><text class="legend-text" x="880" y="764">Institution boundary</text>
    </svg>
  </div>
</body>
</html>
