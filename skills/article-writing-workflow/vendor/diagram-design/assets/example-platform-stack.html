<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments platform · Platform stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #7a8399; --rule: rgba(45,49,66,0.12); --accent: #eb6c36;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 1040px; }
    .eyebrow-tag { font: 500 8px var(--mono); letter-spacing: 0.14em; }
    .tier-name { fill: var(--ink); font: 600 13px var(--sans); }
    .actor { fill: var(--ink); font: 500 11.5px var(--sans); text-anchor: middle; }
    .chip-label { fill: var(--ink); font: 500 10.5px var(--sans); text-anchor: middle; }
    .chip-label.external { fill: var(--muted); }
    .bar-label { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
    .bar-label.focal { fill: var(--accent); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Platform stack · Diagram Design</p>
    <h1>Payments platform · what lives at each tier</h1>

    <svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="platform-stack-title platform-stack-desc">
      <title id="platform-stack-title">Payments platform capability tiers</title>
      <desc id="platform-stack-desc">Six tiers of platform capabilities from consumer-facing access down to external channel providers, with a shared payment orchestrator highlighted and a cross-cutting funds-processing column beside them.</desc>
      <rect width="1200" height="780" fill="#f5f5f5"/>

      <!-- Consumers: pills, outside every tier — they are not capabilities -->
      <rect x="40" y="56" width="1120" height="64" rx="8" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="60" y="76" class="eyebrow-tag" fill="#7a8399">CONSUMERS</text>
      <rect x="216" y="72" width="160" height="32" rx="16" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="296" y="92" class="actor">Consumer</text>
      <rect x="520" y="72" width="160" height="32" rx="16" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="600" y="92" class="actor">Merchant</text>
      <rect x="824" y="72" width="160" height="32" rx="16" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="904" y="92" class="actor">Channel partner</text>

      <!-- Tier bands: order is call direction, top = nearest the consumer -->
      <rect x="40" y="136" width="892" height="60" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="160" class="eyebrow-tag" fill="#7a8399">T1</text>
      <text x="60" y="178" class="tier-name">Access</text>
      <rect x="180" y="152" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="236" y="170" class="chip-label">Open API</text>
      <rect x="304" y="152" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="360" y="170" class="chip-label">Merchant console</text>
      <rect x="428" y="152" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="484" y="170" class="chip-label">Onboarding</text>

      <rect x="40" y="208" width="892" height="100" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="252" class="eyebrow-tag" fill="#7a8399">T2</text>

      <text x="236" y="242" class="chip-label">Travel pay</text>
      <rect x="304" y="224" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="360" y="242" class="chip-label">Utility bills</text>
      <rect x="428" y="224" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="484" y="242" class="chip-label">Tuition pay</text>
      <rect x="552" y="224" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="608" y="242" class="chip-label">Insurance pay</text>
      <rect x="676" y="224" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="732" y="242" class="chip-label">Retail collect</text>
      <rect x="800" y="224" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="856" y="242" class="chip-label">Card payment</text>
      <rect x="180" y="264" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="236" y="282" class="chip-label">Wallet</text>
      <rect x="304" y="264" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="360" y="282" class="chip-label">Payouts</text>
      <rect x="428" y="264" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="484" y="282" class="chip-label">Installments</text>
      <rect x="552" y="264" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>

      <rect x="676" y="264" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>

      <rect x="40" y="320" width="892" height="60" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="344" class="eyebrow-tag" fill="#7a8399">T3</text>
      <text x="60" y="362" class="tier-name">Transaction</text>
      <rect x="180" y="336" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="236" y="354" class="chip-label">Order engine</text>
      <rect x="304" y="336" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="360" y="354" class="chip-label">Collect txn</text>
      <rect x="428" y="336" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="484" y="354" class="chip-label">Payout txn</text>
      <rect x="552" y="336" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="608" y="354" class="chip-label">Auth txn</text>
      <rect x="676" y="336" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>

      <rect x="40" y="392" width="892" height="140" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="456" class="eyebrow-tag" fill="#7a8399">T4</text>
      <text x="60" y="474" class="tier-name">Payment core</text>
      <rect x="180" y="408" width="732" height="28" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="546" y="427" class="bar-label">Checkout</text>
      <rect x="180" y="448" width="732" height="28" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="546" y="467" class="bar-label focal">Payment orchestrator</text>
      <rect x="180" y="488" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>

      <rect x="304" y="488" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="360" y="506" class="chip-label">Gateway pay</text>
      <rect x="428" y="488" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="484" y="506" class="chip-label">Split settle</text>
      <rect x="552" y="488" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>

      <rect x="800" y="488" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="856" y="506" class="chip-label">Aggregated pay</text>

      <rect x="40" y="544" width="892" height="100" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="588" class="eyebrow-tag" fill="#7a8399">T5</text>
      <text x="60" y="606" class="tier-name">Routing</text>
      <rect x="180" y="560" width="732" height="28" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="546" y="579" class="bar-label">Channel manager &amp; router</text>
      <rect x="180" y="600" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="236" y="618" class="chip-label">Protocol pay</text>
      <rect x="304" y="600" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="360" y="618" class="chip-label">Payout</text>
      <rect x="428" y="600" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>

      <rect x="552" y="600" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="608" y="618" class="chip-label">Gateway pay</text>
      <rect x="676" y="600" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="732" y="618" class="chip-label">Auth</text>
      <rect x="800" y="600" width="112" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="856" y="618" class="chip-label">Direct debit</text>

      <rect x="40" y="656" width="892" height="60" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="680" class="eyebrow-tag" fill="#7a8399">T6</text>
      <text x="60" y="698" class="tier-name">Channel</text>
      <rect x="180" y="672" width="112" height="28" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="236" y="690" class="chip-label external">Bank rails</text>
      <rect x="304" y="672" width="112" height="28" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="360" y="690" class="chip-label external">Card networks</text>
      <rect x="428" y="672" width="112" height="28" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="484" y="690" class="chip-label external">Clearing house</text>
      <rect x="552" y="672" width="112" height="28" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="608" y="690" class="chip-label external">Wallet providers</text>

      <!-- Cross-cutting column: serves every tier, so it cannot be stacked with them -->
      <rect x="944" y="136" width="216" height="580" rx="8" fill="rgba(79,93,117,0.05)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="964" y="164" class="eyebrow-tag" fill="#7a8399">CROSS-CUTTING</text>
      <text x="964" y="184" class="tier-name">Funds processing</text>
      <rect x="964" y="244" width="176" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="1052" y="262" class="chip-label">Clearing</text>
      <rect x="964" y="336" width="176" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="1052" y="354" class="chip-label">Billing</text>
      <rect x="964" y="448" width="176" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="1052" y="466" class="chip-label">Ledger</text>
      <rect x="964" y="580" width="176" height="28" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="1052" y="598" class="chip-label">Accounts</text>

      <!-- Legend: the four shapes are not interchangeable -->
      <rect x="40" y="740" width="24" height="12" rx="3" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="72" y="749" class="eyebrow-tag" fill="#7a8399">CAPABILITY</text>
      <rect x="196" y="740" width="24" height="12" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="228" y="749" class="eyebrow-tag" fill="#7a8399">SHARED · EXACTLY ONE</text>
      <rect x="416" y="740" width="24" height="12" rx="3" fill="rgba(79,93,117,0.05)" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="448" y="749" class="eyebrow-tag" fill="#7a8399">CROSS-CUTTING</text>
      <rect x="592" y="740" width="24" height="12" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="624" y="749" class="eyebrow-tag" fill="#7a8399">OUTSIDE THE PLATFORM</text>
      <rect x="804" y="740" width="24" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="836" y="749" class="eyebrow-tag" fill="#7a8399">FOCAL</text>
    </svg>
  </main>
</body>
</html>
